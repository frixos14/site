
DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>BINANCE // TERMINAL</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="noise"></div>

  <main class="terminal">
    <header>
      <h1>BINANCE<span>API</span></h1>
      <p>Terminal de mercado — Spot</p>
    </header>

    <section class="controls">
      <input id="symbol" placeholder="EX: BTCUSDT" value="BTCUSDT" />
      <button id="btn">CONSULTAR</button>
    </section>

    <section id="status" class="status"></section>

    <section id="resultado" class="card hidden">
      <h2 id="par"></h2>
      <div class="preco">
        <span>$</span><strong id="preco"></strong>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
